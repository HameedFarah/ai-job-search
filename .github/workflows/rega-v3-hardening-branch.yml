name: REGA v3 hardening branch

on:
  push:
    branches:
      - fix/rega-resolution-v3-hardening-20260909

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: fix/rega-resolution-v3-hardening-20260909
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Apply idempotent REGA hardening patch
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('runtime/rega_resolution_v3.py')
          text = runtime.read_text()

          marker = '\n\ndef persist_unvalidated_mailbox('
          if 'def persist_route_unconfirmed(' not in text:
              helper = '''\n\ndef persist_route_unconfirmed(\n    token: str,\n    headers: list[str],\n    row: dict[str, str],\n    domain: str,\n    priority: str,\n    score: int,\n    reason: str,\n    muqawil: MuqawilProfile | None,\n) -> None:\n    next_action = (\n        "Priority-A targeted manual employment-route review; keep non-sendable"\n        if priority == "A"\n        else "Reopen only when new first-party employment evidence appears"\n    )\n    _persist(\n        token, headers, row,\n        {\n            "Address_or_Website": str(row.get("Address_or_Website") or "").strip() or f"https://{domain}/",\n            "Source_Status": "Resolved - verified company; employment route unconfirmed",\n            "Send_Eligibility": "NO_VERIFIED_EMAIL_ROUTE",\n            "Next_Action": next_action,\n        },\n        f"{_context(priority, score, muqawil)}; terminal=EMPLOYMENT_ROUTE_UNCONFIRMED; reason={reason}",\n    )\n'''
              if marker not in text:
                  raise SystemExit('persist helper insertion marker missing')
              text = text.replace(marker, helper + marker, 1)

          old = '    start_balance = legacy.balance(client) if client is not None else None\n'
          new = '''    paid_boot_error = ""\n    if client is not None:\n        try:\n            start_balance = legacy.balance(client)\n        except Exception as exc:\n            paid_boot_error = type(exc).__name__\n            start_balance = None\n            client = None  # paid-provider health may never block the free pass\n    else:\n        start_balance = None\n'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '        "receiving_queued": 0, "resolved_no_route": 0, "identity_unconfirmed": 0,\n'
          new = '        "receiving_queued": 0, "resolved_no_route": 0, "route_unconfirmed": 0, "identity_unconfirmed": 0,\n'
          if old in text:
              text = text.replace(old, new, 1)

          old = '''            except Exception as exc:\n                provider_candidates = []\n                counts["provider_failures"] += 1\n            candidate, rejected = legacy.select_best_eligible_candidate(provider_candidates, known_emails, permanent_bounces)\n'''
          new = '''            except Exception as exc:\n                counts["provider_failures"] += 1\n                counts["route_unconfirmed"] += 1\n                persist_route_unconfirmed(\n                    token, headers, row, domain, priority, score,\n                    f"bounded contact provider failure={type(exc).__name__}", muqawil,\n                )\n                _checkpoint(\n                    checkpoints, checkpoint_path, master_id, state="resolved",\n                    result="verified_domain_route_provider_failure", domain=domain,\n                    priority=priority, score=score,\n                )\n                continue\n            candidate, rejected = legacy.select_best_eligible_candidate(provider_candidates, known_emails, permanent_bounces)\n'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '    end_balance = legacy.balance(client) if client is not None else None\n'
          new = '''    end_balance_error = ""\n    if client is not None:\n        try:\n            end_balance = legacy.balance(client)\n        except Exception as exc:\n            end_balance_error = type(exc).__name__\n            end_balance = None\n    else:\n        end_balance = None\n'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '        "balance_after": end_balance,\n        "reserve_usd": reserve,\n'
          new = '        "balance_after": end_balance,\n        "paid_boot_error": paid_boot_error,\n        "end_balance_error": end_balance_error,\n        "reserve_usd": reserve,\n'
          if old in text:
              text = text.replace(old, new, 1)
          runtime.write_text(text)

          resolution = Path('career_engine/rega_enrichment/resolution.py')
          text = resolution.read_text()
          old = '    "resolved - verified company; no usable employment route",\n'
          new = old + '    "resolved - verified company; employment route unconfirmed",\n'
          if 'resolved - verified company; employment route unconfirmed' not in text:
              if old not in text:
                  raise SystemExit('terminal-state insertion marker missing')
              text = text.replace(old, new, 1)
          resolution.write_text(text)

          tests = Path('tests/test_rega_resolution_v3_unittest.py')
          text = tests.read_text()
          old = '            "Resolved - verified company; no usable employment route",\n'
          new = old + '            "Resolved - verified company; employment route unconfirmed",\n'
          if 'Resolved - verified company; employment route unconfirmed' not in text:
              text = text.replace(old, new, 1)
          tests.write_text(text)
          PY
      - name: Install test dependencies
        run: python -m pip install pytest python-docx httpx pyyaml
      - name: Validate
        run: |
          python -m py_compile career_engine/rega_enrichment/resolution.py runtime/rega_resolution_v3.py tests/test_rega_resolution_v3_unittest.py
          python -m unittest tests.test_rega_resolution_v3_unittest -v
      - name: Commit hardening when needed
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name HameedFarah
          git config user.email 92652480+HameedFarah@users.noreply.github.com
          git add career_engine/rega_enrichment/resolution.py runtime/rega_resolution_v3.py tests/test_rega_resolution_v3_unittest.py
          git commit -m "fix(career): harden REGA resolver provider failures"
          git push origin HEAD:fix/rega-resolution-v3-hardening-20260909
