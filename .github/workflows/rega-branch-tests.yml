name: REGA Branch Tests

on:
  push:
    branches:
      - fix/rega-portal-first-20260906

permissions:
  contents: read

jobs:
  rega-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install pytest httpx
      - name: Compile changed runtime
        run: |
          python -m py_compile career_engine/rega_enrichment/employment_routes.py
          python -m py_compile runtime/rega_priority_scan.py
          python -m py_compile runtime/run_rega_priority_scan.py
      - name: Run focused REGA tests
        run: pytest -q tests/test_rega_employment_routes.py tests/test_rega_priority_scan_runtime.py
