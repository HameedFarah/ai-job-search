name: REGA Regression Temp

on:
  push:
    branches:
      - fix/rega-portal-first-20260906

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install pytest python-docx httpx pyyaml
      - name: Focused REGA pytest
        run: pytest -q tests/test_rega_employment_routes.py tests/test_rega_priority_scan_runtime.py
      - name: Existing Python unittest suite
        if: always()
        run: python -m unittest discover -s tests -t . -v
      - name: Security guards
        if: always()
        run: python tools/security_guards.py
      - name: Skill and command lint
        if: always()
        run: python tools/lint_skills.py
