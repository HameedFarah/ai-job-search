name: Career private dashboard

# Automatic branch/PR triggers are disabled. Run explicitly when these legacy
# migration checks are needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check dashboard/career-review/scripts/deploy_cloudflare_access.js
          node --check dashboard/career-review/worker.js
          node --check dashboard/career-review/site/assets/shared.js
          node --check dashboard/career-review/site/assets/overlay-layout.js
          node --check scripts/career-cloudflare-access-20260818-plan.mjs
      - name: Access policy self-test
        run: node dashboard/career-review/scripts/deploy_cloudflare_access.js --self-test
      - name: Validate trackable plan
        run: |
          node scripts/career-cloudflare-access-20260818-plan.mjs validate
          node scripts/career-cloudflare-access-20260818-plan.mjs summary
          node scripts/career-cloudflare-access-20260818-plan.mjs next
      - name: Validate Worker privacy config
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('dashboard/career-review/wrangler.jsonc', 'utf8'));
          if (config.name !== 'career-engine-private') throw new Error('unexpected Worker name');
          if (config.main !== './worker.js') throw new Error('private Worker main must be ./worker.js');
          if (config.workers_dev !== false) throw new Error('workers_dev must be false');
          if (config.preview_urls !== false) throw new Error('preview_urls must be false');
          if (config.assets?.directory !== './site') throw new Error('static asset directory must be ./site');
          if (config.assets?.binding !== 'ASSETS') throw new Error('static assets must be available through the ASSETS binding');
          const workerFirst = config.assets?.run_worker_first || [];
          if (workerFirst.length !== 1 || workerFirst[0] !== '/.herenow/data/*') {
            throw new Error('Worker-first routing must be limited to /.herenow/data/*');
          }
          const requiredSecrets = config.secrets?.required || [];
          if (requiredSecrets.length !== 1 || requiredSecrets[0] !== 'HERENOW_API_KEY') {
            throw new Error('HERENOW_API_KEY must be the only declared required Worker secret');
          }
          const routes = Array.isArray(config.routes) ? config.routes : [];
          if (routes.length !== 1 || routes[0].pattern !== 'career.farahdigital.com/*' || routes[0].zone_name !== 'farahdigital.com') {
            throw new Error('Worker route must be exactly career.farahdigital.com/* in farahdigital.com');
          }
          NODE
      - name: No literal deployment credential assignments
        run: |
          if git grep -nE '(CLOUDFLARE_(API_TOKEN|ACCOUNT_ID|ZONE_ID)|HERENOW_API_KEY)=[^$[:space:]]+' -- dashboard/career-review docs/implementation docs/reports; then
            echo '::error::Possible literal deployment credential assignment committed in migration source'
            exit 1
          fi
