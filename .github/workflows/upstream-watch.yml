# Weekly upstream triage. Reports only - it NEVER merges, pushes, or edits code.
#
# It fetches the upstream template, runs tools/upstream_triage.py to sort the
# commits this downstream lacks into "worth reviewing" vs "probably skip",
# and publishes the complete report in the GitHub Actions run summary.
#
# The report/act boundary is deliberate: on a diverged downstream, "applies
# cleanly" is not proof that an upstream change is correct. The workflow stops
# at review-ready cherry-pick lines; a reviewed port remains a separate change.

name: Upstream watch

on:
  schedule:
    - cron: "0 8 * * 1" # 08:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage:
    name: Triage upstream commits
    if: github.repository != 'MadsLorentzen/ai-job-search'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Fetch upstream template
        run: |
          git remote add upstream https://github.com/MadsLorentzen/ai-job-search.git 2>/dev/null || true
          git fetch --quiet upstream master

      - name: Build and publish triage report
        run: |
          {
            echo "# Career Engine upstream review"
            echo
            echo "_Last checked: $(date -u '+%Y-%m-%d %H:%M UTC') · [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
            echo
            python tools/upstream_triage.py --remote upstream --branch master
          } > report.md
          cat report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
