# Watches the separately maintained ATS implementation dependency.
# Reports a new upstream ref; NEVER changes the lock or production checkout.

name: Managed ATS source watch

on:
  schedule:
    - cron: "20 8 * * 1" # Monday 08:20 UTC, after the main upstream watch
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compare reviewed lock to maintained upstream
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          repo=$(python -c 'from career_engine.sources.managed_providers import UPSTREAM_REPO; print(UPSTREAM_REPO)')
          branch=$(python -c 'from career_engine.sources.managed_providers import UPSTREAM_BRANCH; print(UPSTREAM_BRANCH)')
          locked=$(python -c 'from career_engine.sources.managed_providers import UPSTREAM_REF; print(UPSTREAM_REF)')
          latest=$(git ls-remote "https://github.com/${repo}.git" "refs/heads/${branch}" | awk '{print $1}')
          if [ -z "$latest" ]; then
            echo "Could not resolve ${repo}:${branch}" >&2
            exit 1
          fi
          {
            echo "repo=$repo"
            echo "branch=$branch"
            echo "locked=$locked"
            echo "latest=$latest"
            if [ "$locked" = "$latest" ]; then echo "changed=false"; else echo "changed=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Build rolling report
        env:
          REPO: ${{ steps.compare.outputs.repo }}
          BRANCH: ${{ steps.compare.outputs.branch }}
          LOCKED: ${{ steps.compare.outputs.locked }}
          LATEST: ${{ steps.compare.outputs.latest }}
          CHANGED: ${{ steps.compare.outputs.changed }}
        run: |
          {
            echo "_Last checked: $(date -u '+%Y-%m-%d %H:%M UTC')_"
            echo
            echo "Managed ATS implementation: \`$REPO\`"
            echo
            echo "- reviewed/runtime lock: \`$LOCKED\`"
            echo "- current \`$BRANCH\`: \`$LATEST\`"
            echo
            if [ "$CHANGED" = "true" ]; then
              echo "**Review required.** Upstream moved. Compare the locked ref to the new ref, review changes touching the enabled portal adapters/sources, run Career Engine regression probes, then deliberately bump the lock and the VPS sparse checkout. Do not auto-activate the new code."
              echo
              echo "Compare: https://github.com/$REPO/compare/$LOCKED...$LATEST"
            else
              echo "No managed ATS source update is pending."
            fi
          } > managed-source-report.md
          cat managed-source-report.md

      - name: Open or update rolling issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Managed ATS source sync watch"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title==\"$title\") | .number" | head -n1)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file managed-source-report.md
          else
            gh issue create --title "$title" --body-file managed-source-report.md
          fi
