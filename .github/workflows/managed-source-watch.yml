# Watches the separately maintained ATS implementation dependency.
# Reports a new upstream ref in the GitHub Actions summary; NEVER changes the
# reviewed lock or production checkout automatically.

name: Managed ATS source watch

# Scheduled GitHub polling is disabled. Run manually when upstream review is needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compare reviewed lock to maintained upstream
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          repo=$(python -c 'from career_engine.sources.managed_providers import UPSTREAM_REPO; print(UPSTREAM_REPO)')
          branch=$(python -c 'from career_engine.sources.managed_providers import UPSTREAM_BRANCH; print(UPSTREAM_BRANCH)')
          locked=$(python -c 'from career_engine.sources.managed_providers import UPSTREAM_REF; print(UPSTREAM_REF)')
          latest=$(git ls-remote "https://github.com/${repo}.git" "refs/heads/${branch}" | awk '{print $1}')
          if [ -z "$latest" ]; then
            echo "Could not resolve ${repo}:${branch}" >&2
            exit 1
          fi
          {
            echo "repo=$repo"
            echo "branch=$branch"
            echo "locked=$locked"
            echo "latest=$latest"
            if [ "$locked" = "$latest" ]; then echo "changed=false"; else echo "changed=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish managed-source report
        env:
          REPO: ${{ steps.compare.outputs.repo }}
          BRANCH: ${{ steps.compare.outputs.branch }}
          LOCKED: ${{ steps.compare.outputs.locked }}
          LATEST: ${{ steps.compare.outputs.latest }}
          CHANGED: ${{ steps.compare.outputs.changed }}
        run: |
          {
            echo "# Managed ATS source review"
            echo
            echo "_Last checked: $(date -u '+%Y-%m-%d %H:%M UTC') · [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
            echo
            echo "Managed ATS implementation: \`$REPO\`"
            echo
            echo "- reviewed/runtime lock: \`$LOCKED\`"
            echo "- current \`$BRANCH\`: \`$LATEST\`"
            echo
            if [ "$CHANGED" = "true" ]; then
              echo "**Review required.** Upstream moved. Compare the locked ref to the new ref, review changes touching enabled portal adapters/sources, run Career Engine regression probes, then deliberately bump the lock and VPS sparse checkout. Do not auto-activate the new code."
              echo
              echo "Compare: https://github.com/$REPO/compare/$LOCKED...$LATEST"
            else
              echo "No managed ATS source update is pending."
            fi
          } > managed-source-report.md
          cat managed-source-report.md
          cat managed-source-report.md >> "$GITHUB_STEP_SUMMARY"
