name: REGA v3 branch smoke

on:
  push:
    branches:
      - feature/rega-resolution-v3-20260909

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install httpx
      - name: Compile REGA v3 modules
        run: python -m py_compile career_engine/rega_enrichment/resolution.py runtime/rega_resolution_v3.py
      - name: Run REGA v3 unittest acceptance
        run: python -m unittest tests.test_rega_resolution_v3_unittest -v
