name: REGA resolution v3 branch check

on:
  push:
    branches:
      - feature/rega-resolution-v3-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest python-docx httpx pyyaml
      - name: Syntax check REGA v3
        run: |
          python -m py_compile career_engine/rega_enrichment/resolution.py
          python -m py_compile runtime/rega_resolution_v3.py
          python -m py_compile tests/test_rega_resolution_v3_unittest.py
      - name: Run REGA v3 acceptance unit tests
        run: python -m unittest tests.test_rega_resolution_v3_unittest -v
